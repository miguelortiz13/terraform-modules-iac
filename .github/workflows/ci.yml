name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: 1.16.5
  TFLINT_VERSION: v0.55.0

jobs:
  discover:
    name: Descubrir módulos
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.list.outputs.modules }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        # Un módulo es cualquier carpeta modules/<proveedor>/<nombre> con versions.tf.
        run: |
          modules=$(find modules -mindepth 3 -maxdepth 3 -name versions.tf -printf '%h\n' | sort | jq -R . | jq -sc .)
          echo "modules=$modules" >> "$GITHUB_OUTPUT"

  static:
    name: Formato, docs, seguridad y secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: README de módulos al día (terraform-docs)
        env:
          TFDOCS_VERSION: v0.24.0
        run: |
          curl -sSLo /tmp/tfdocs.tgz "https://github.com/terraform-docs/terraform-docs/releases/download/${TFDOCS_VERSION}/terraform-docs-${TFDOCS_VERSION}-linux-amd64.tar.gz"
          tar -xzf /tmp/tfdocs.tgz -C /tmp terraform-docs
          for dir in $(find modules -mindepth 3 -maxdepth 3 -name versions.tf -printf '%h\n'); do
            /tmp/terraform-docs --config .terraform-docs.yml "$dir" > /dev/null
          done
          if ! git diff --exit-code -- modules; then
            echo "::error::README desactualizado: ejecuta terraform-docs ${TFDOCS_VERSION} y confirma los cambios."
            exit 1
          fi

      # Antes de Checkov: su contenedor deja results.sarif con dueño root y
      # Gitleaks ya no puede escribir su reporte.
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: modules
          config_file: .checkov.yaml


  module:
    name: ${{ matrix.module }}
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.discover.outputs.modules) }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: terraform init
        working-directory: ${{ matrix.module }}
        run: terraform init -backend=false -input=false

      - name: terraform validate
        working-directory: ${{ matrix.module }}
        run: terraform validate

      - name: tflint
        run: |
          tflint --init --config="$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --chdir="${{ matrix.module }}" --config="$GITHUB_WORKSPACE/.tflint.hcl"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: terraform test (proveedores simulados, sin nube)
        working-directory: ${{ matrix.module }}
        run: |
          if [ -d tests ]; then terraform test; else echo "::error::El módulo no tiene tests" && exit 1; fi

  examples:
    name: Ejemplos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Validar cada ejemplo
        run: |
          for dir in $(find examples -name versions.tf -printf '%h\n' | sort); do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done
