name: Release

# Conventional Commits -> release-please abre un PR de release con el
# CHANGELOG; al fusionarlo crea la etiqueta vX.Y.Z que consumen los proyectos.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          release-type: simple
